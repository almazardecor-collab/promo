<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votre salon chez vous — AlmazarDecor</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Barlow;src:local("Barlow Semi Condensed"),local("Barlow")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9ecea;color:#1c2624;font-family:"Barlow Semi Condensed",Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.logo{font-weight:800;letter-spacing:.06em;color:#1f5f8b;font-size:1.05rem}
.logo small{display:block;font-weight:500;letter-spacing:0;color:#5b6866;font-size:.8rem}
.info{text-align:right}
#titre{font-weight:700;font-size:1rem}
#cotes{color:#5b6866;font-size:.85rem}
main{flex:1;position:relative;min-height:0}
model-viewer{width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#f6f7f6,#dfe3e1);--poster-color:transparent}
.charge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5b6866;font-size:1rem;pointer-events:none}
body.pret .charge{display:none}
footer{padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#e9ecea}
#ar{appearance:none;border:0;border-radius:14px;background:#1f5f8b;color:#fff;font:inherit;font-weight:700;font-size:1.15rem;padding:14px 12px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(31,95,139,.35)}
#ar .ar2{font-weight:600;opacity:.9;font-size:1rem}
#ar.off{background:#8a9896;box-shadow:none}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:#3d4a48}
.opts label{display:flex;align-items:center;gap:8px}
.opts input{width:20px;height:20px;accent-color:#1f5f8b}
#msg{font-size:.88rem;color:#7a3b1c;min-height:0}
.aide{font-size:.8rem;color:#5b6866}
</style>
</head>
<body>
<header>
  <div class="logo">ALMAZARDECOR<small>Votre salon chez vous</small></div>
  <div class="info"><div id="titre">Salon</div><div id="cotes"></div></div>
</header>
<main>
  <model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" camera-orbit="-25deg 62deg auto" shadow-intensity="1.1" shadow-softness="0.8"
    exposure="1.05" environment-image="neutral" interaction-prompt="auto" alt="Salon marocain AlmazarDecor en 3D">
    <button slot="ar-button" style="display:none"></button>
  </model-viewer>
  <div class="charge">Préparation de votre salon…</div>
</main>
<footer>
  <button id="ar">📱 Voir chez moi <span class="ar2">· شوفو فدارك</span></button>
  <div class="opts">
    <label id="matL"><input type="checkbox" id="mat"> Voir avec matelas (option)</label>
    <span class="aide">Pointez le sol, le salon se pose à la vraie taille.</span>
  </div>
  <div id="msg"></div>
</footer>
<script type="module" src="ar/ar.js"></script>
</body>
</html>
